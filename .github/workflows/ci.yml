name: CI

# Enterprise-shape CI: independent jobs for test, lint/format, and security
# scanning run in parallel on GitHub's free-tier hosted runners. A final
# `ci-gate` job aggregates their results so branch protection only needs to
# require ONE check ("ci-gate"), not track every job name individually.
#
# This still runs entirely on ubuntu-latest -- no paid minutes, no
# self-hosted runner, no live Databricks/Azure connection required.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (pandas mirror, no Spark needed)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests with coverage
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  lint:
    name: Lint & format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8

      - name: Check formatting (black) -- blocking
        run: black --check --line-length 88 src/ utils/ tests/

      - name: Lint (flake8) -- informational only, does not fail the build
        # A few findings here are intentional patterns (re-export imports in
        # __init__.py files show as "unused" to flake8 but aren't) rather
        # than real problems, and notebooks/ is deliberately excluded --
        # Databricks notebooks reference injected globals (dbutils, spark,
        # display) that don't exist outside a running notebook.
        continue-on-error: true
        run: flake8 --max-line-length=88 --extend-ignore=E203,W503 src/ utils/ tests/

  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanners
        run: pip install --upgrade pip pip-audit bandit

      - name: Dependency vulnerability audit (pip-audit)
        # Reports known CVEs in requirements.txt. Informational -- a fresh
        # portfolio repo may briefly lag a CVE disclosure; treat this as a
        # signal to review, not an automatic hard fail, until you've set a
        # deliberate policy on acceptable severity thresholds.
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Static security scan (bandit)
        # Scans src/ and utils/ for common insecure-code patterns (e.g.
        # hardcoded credentials, unsafe deserialization). notebooks/ is
        # excluded for the same reason it's excluded from flake8.
        continue-on-error: true
        run: bandit -r src/ utils/ -ll

  ci-gate:
    name: CI gate (required check)
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.lint.result }}" != "success" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required checks passed."
